
name: Test Tonghuashun Public Page

'on'::
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public homepage
        run: |
          python3 - <<'PY'
          import urllib.request
          import re

          url = "https://t.10jqka.com.cn/lgt/community/personal-homepage.html?user_code=1179giyc4jr06d6785e69e&client_userid=vB5Um&back_source=hyperlink&share_hxapp=isc&fontzoom=no"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  html = r.read().decode("utf-8", errors="replace")
                  print("HTTP状态:", r.status)
                  print("内容类型:", r.headers.get("Content-Type"))
                  print("网页长度:", len(html))
                  title = re.search(r"<title[^>]*>(.*?)</title>", html, re.I | re.S)
                  print("网页标题:", title.group(1).strip() if title else "未找到")
                  print("是否含动态ID字段:", "contentId" in html or "content_id" in html)
                  print("网页内容开头（最多800字符）:")
                  print(html[:800])
          except Exception as e:
              print("读取失败:", repr(e))
              raise
          PY
